<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bugra's Lyrics App</title>
  <script src="javascript.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-black min-h-screen flex items-center justify-center p-6 transition-colors duration-300">
  <div id="container" class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-6 transition-colors duration-300">
    
    <h1 class="text-4xl font-bold text-center mb-6 text-blue-700">♬ Bugra's Lyrics App</h1>

    <form id="lyrics-form" class="mb-6">
      <input id="artist" class="w-full mb-3 p-3 rounded border bg-white text-black placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 transition" type="text" placeholder="Artist" required />
      <input id="song" class="w-full mb-4 p-3 rounded border bg-white text-black placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 transition" type="text" placeholder="Song" required />
      <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Get Lyrics</button>
    </form>

    <div id="lyrics-output" class="whitespace-pre-wrap mb-4 text-sm text-gray-800"></div>
    <div id="youtube-frame" class="mb-4"></div>
    <a id="youtube-link" href="#" target="_blank" class="hidden text-blue-600 underline text-sm mb-4 block">▶️ Watch on YouTube</a>

    <button id="save-favorite" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 hidden mb-4">❤️ Add to Favorites</button>

    <h2 class="text-lg font-semibold mb-2">⭐ Favorites</h2>
    <ul id="favorites-list" class="text-sm text-black mb-6"></ul>
    <button onclick="clearFavorites()" class="mt-2 bg-gray-300 text-black px-3 py-1 rounded hover:bg-gray-400 text-sm">🗑️ Clear Favorites</button>

    <div class="mt-10">
    <h2 id="history-title" class="text-lg font-semibold mb-2">🕒 Search History</h2>
    <ul id="history-list" class="text-sm text-black"></ul>
    <button onclick="clearHistory()" class="mt-6 bg-gray-300 text-black px-3 py-1 rounded hover:bg-gray-400 text-sm">🧹 Clear History</button>
    </div>
    
    <div class="flex items-center justify-center mt-6">
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="theme-toggle" class="sr-only peer" onchange="changeTheme()" />
        <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-600 peer-checked:bg-yellow-400 transition"></div>
        <div class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full transition peer-checked:translate-x-full"></div>
      </label>
      <span class="ml-3 text-sm font-medium text-gray-700 dark:text-gray-300" id="theme-label">🌙 Dark Mode</span>
    </div>
    

    <div id="footer" class="mt-8 text-sm text-gray-600 text-center">
      <p>Developed by <strong>Bugra Kaan</strong> – Powered by lyrics.ovh API</p>
    </div>
  </div>
</body>
</html>
